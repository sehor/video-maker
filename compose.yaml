services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_factory}
      POSTGRES_USER: ${POSTGRES_USER:-video_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_factory_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video_factory} -d ${POSTGRES_DB:-video_factory}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://video_factory:video_factory_dev@postgres:5432/video_factory}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://web:3000/api/auth/jwks}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3000}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-video-factory-api}
      STORAGE_ROOT: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WORKFLOW_BACKEND: ${WORKFLOW_BACKEND:-local}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-lite:7077}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-http://hatchet-lite:8888}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./packages/api-client:/packages/api-client
      - local-storage:/data/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BETTER_AUTH_DATABASE_URL: ${BETTER_AUTH_DATABASE_URL:-postgresql://video_factory:video_factory_dev@postgres:5432/video_factory}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-before-use}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-video-factory-api}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
      NUXT_PUBLIC_AUTH_BASE_URL: ${NUXT_PUBLIC_AUTH_BASE_URL:-http://localhost:3000}
    command: sh -c "npm run auth:migrate && npm run dev -- --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - ./packages/api-client:/workspace/packages/api-client
      - web-node-modules:/workspace/node_modules

  hatchet-postgres:
    profiles: ["hatchet"]
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hatchet
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - hatchet-postgres-data:/var/lib/postgresql/data

  hatchet-lite:
    profiles: ["hatchet"]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.98.9
    depends_on:
      hatchet-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hatchet:hatchet_dev@hatchet-postgres:5432/hatchet?sslmode=disable
      SERVER_URL: http://localhost:8888
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-lite:7077
      SERVER_GRPC_INSECURE: "t"
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_TASKQUEUE_KIND: postgres
    ports:
      - "8888:8888"
      - "7077:7077"
    volumes:
      - hatchet-lite-config:/config

  hatchet-worker:
    profiles: ["hatchet"]
    build: ./apps/api
    command: python -m app.hatchet_workflow
    depends_on:
      postgres:
        condition: service_healthy
      hatchet-lite:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://video_factory:video_factory_dev@postgres:5432/video_factory}
      STORAGE_ROOT: /data/storage
      WORKFLOW_BACKEND: hatchet
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-lite:7077}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-http://hatchet-lite:8888}
    volumes:
      - ./apps/api:/app
      - local-storage:/data/storage

volumes:
  postgres-data:
  local-storage:
  web-node-modules:
  hatchet-postgres-data:
  hatchet-lite-config:
