name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-checks:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      WORKFLOW_BACKEND: local
      TEST_DATABASE_URL: postgresql+psycopg://postgres:@127.0.0.1:55432/video_factory_ci_test
      UV_CACHE_DIR: ${{ github.workspace }}/apps/api/.uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: |
          uv sync --project apps/api --locked --extra dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @video-factory/web exec playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start disposable Windows PostgreSQL on the CI runner
        run: |
          $pgBin = Get-ChildItem 'C:\Program Files\PostgreSQL' -Filter pg_ctl.exe -Recurse |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $pgBin) { throw 'Windows PostgreSQL binaries are required' }
          $pgData = Join-Path $env:RUNNER_TEMP 'video-factory-pg'
          & "$pgBin/initdb.exe" -D $pgData -U postgres -A trust --encoding=UTF8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$pgBin/pg_ctl.exe" -D $pgData -l "$env:RUNNER_TEMP/postgres.log" -o '-h 127.0.0.1 -p 55432' -w start
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$pgBin/createdb.exe" -h 127.0.0.1 -p 55432 -U postgres video_factory_ci_test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TEST_PG_BIN=$pgBin" >> $env:GITHUB_ENV
          "TEST_PG_DATA=$pgData" >> $env:GITHUB_ENV
      - name: Python and Web behavior tests
        run: pnpm test
      - name: Static checks and generated API client
        run: |
          uv run --project apps/api --no-sync ruff check apps/api/app apps/api/tests scripts/test.py scripts/test_support.py scripts/dev.py conftest.py tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location apps/api
          uv run --no-sync python scripts/export_openapi.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          pnpm --filter @video-factory/api-client check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- packages/api-client
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native browser business flow with a fresh production build
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            .test-runs/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 3
      - name: Stop only the temporary CI database
        if: always() && env.TEST_PG_DATA != ''
        run: |
          & "$env:TEST_PG_BIN/pg_ctl.exe" -D $env:TEST_PG_DATA -m fast -w stop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  test:
    runs-on: windows-2022
    needs: [native-checks]
    if: always()
    steps:
      - name: Preserve required check and reject failed or skipped validation
        shell: pwsh
        env:
          NATIVE_RESULT: ${{ needs.native-checks.result }}
        run: |
          if ($env:NATIVE_RESULT -ne 'success') { exit 1 }
