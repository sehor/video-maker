name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Build services
        run: docker compose build
      - name: Install E2E dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @video-factory/web exec playwright install --with-deps chromium
      - name: API tests
        run: docker compose run --rm api pytest -q
      - name: API lint
        run: docker compose run --rm api ruff check app tests
      - name: Fixed worker-comfyui contract
        run: |
          python -m unittest discover -s tests -p "test_*poc.py"
          python workers/runpod-comfyui/contract/validate.py --root .
      - name: FFmpeg build and license inventory
        run: docker compose run --rm api python scripts/export_ffmpeg_build.py
      - name: Web unit tests
        run: docker compose run --rm web pnpm run test
      - name: Web lint and build
        run: |
          docker compose run --rm web pnpm run lint
          docker compose run --rm web pnpm run build
      - name: OpenAPI client is current
        run: |
          docker compose run --rm api python scripts/export_openapi.py
          docker compose run --rm web pnpm run generate:client
          git diff --exit-code -- packages/api-client
      - name: End-to-end business loop
        run: |
          docker compose up -d
          timeout 120 sh -c 'until curl -fsS http://localhost:3000/login >/dev/null && curl -fsS http://localhost:8000/healthz >/dev/null; do sleep 2; done'
          E2E_BASE_URL=http://localhost:3000 pnpm --filter @video-factory/web test:e2e
      - name: Stop services
        if: always()
        run: docker compose down -v
