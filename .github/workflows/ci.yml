name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Repository command baseline
        run: python3 scripts/check_repository_baseline.py
      - name: Build services
        run: docker compose build
      - name: Install E2E dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @video-factory/web exec playwright install --with-deps chromium
      - name: API tests
        run: |
          docker compose run --rm --no-deps \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo/apps/api \
            api pytest -q tests
      - name: API lint
        run: |
          docker compose run --rm --no-deps \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo/apps/api \
            api ruff check app tests
      - name: PostgreSQL migration baseline
        env:
          TEST_DATABASE_URL: postgresql+psycopg://video_factory:video_factory_dev@postgres:5432/video_factory_ci_test
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres \
            psql -U video_factory -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE video_factory_ci_test"
          docker compose run --rm --no-deps -w /app \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            api alembic upgrade head
          docker compose run --rm --no-deps -w /app \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            api python scripts/check_database_head.py
      - name: PostgreSQL concurrency regressions
        env:
          TEST_DATABASE_URL: postgresql+psycopg://video_factory:video_factory_dev@postgres:5432/video_factory_ci_test
        run: |
          for run in 1 2 3; do
            echo "PostgreSQL concurrency run ${run}/3"
            docker compose run --rm --no-deps -w /app \
              -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
              api pytest -q \
              tests/test_quote_ledger.py::test_competing_submissions_cannot_overdraw \
              tests/test_batch_atomic.py::test_competing_batches_cannot_overdraw_wallet
          done
      - name: Fixed worker-comfyui contract
        run: |
          docker compose run --rm --no-deps \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            api sh -c 'python -m unittest discover -s tests -p "test_*poc.py" && python workers/runpod-comfyui/contract/validate.py --root .'
      - name: FFmpeg build and license inventory
        run: docker compose run --rm api python scripts/export_ffmpeg_build.py
      - name: Web unit tests
        run: docker compose run --rm web pnpm run test
      - name: Web lint and build
        run: |
          docker compose run --rm web pnpm run lint
          docker compose run --rm web pnpm run build
      - name: OpenAPI client is current
        run: |
          docker compose run --rm --no-deps -w /app api python scripts/export_openapi.py
          pnpm --filter @video-factory/api-client check
          git diff --exit-code -- packages/api-client
      - name: End-to-end business loop
        run: |
          docker compose up -d
          timeout 120 sh -c 'until curl -fsS http://localhost:3000/login >/dev/null && curl -fsS http://localhost:8000/healthz >/dev/null; do sleep 2; done'
          E2E_BASE_URL=http://localhost:3000 pnpm --filter @video-factory/web test:e2e
      - name: Stop services
        if: always()
        run: docker compose down -v
