[pytest]
testpaths = apps/api/tests tests
pythonpath = apps/api scripts
addopts = --strict-markers --strict-config -ra --tb=short
markers =
    database: PostgreSQL integration, isolated schema on the native test database
    media: real FFmpeg/ffprobe validation
    windows: Windows process behavior
    posix: POSIX process behavior (not applicable on Windows)
    live: explicitly requested remote service verification
    integration: legacy live service classification
    hatchet_cloud: explicitly requested Hatchet Cloud verification
